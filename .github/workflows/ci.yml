name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        if: matrix.node-version == '20.x'

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run prepare_publish

      - name: Verify packed package
        run: npm run test:package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  dotnet-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install TypeScript reference
        run: |
          npm ci
          npm run prepare_publish

      - name: Restore .NET projects
        run: dotnet restore dotnet/Iqb.Responses.sln

      - name: Build .NET projects
        run: dotnet build dotnet/Iqb.Responses.sln --configuration Release --no-restore

      - name: Run parity tests and enforce coverage
        run: >-
          dotnet test dotnet/Iqb.Responses.sln
          --configuration Release
          --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=90%2c80
          /p:ThresholdType=line%2cbranch
          /p:ThresholdStat=total

      - name: Compare TypeScript and .NET results
        run: npm run test:differential

      - name: Upload .NET coverage
        uses: codecov/codecov-action@v3
        with:
          file: dotnet/test/Iqb.Responses.Tests/coverage.cobertura.xml
          flags: dotnet
          name: dotnet-coverage

  dotnet-package:
    runs-on: ubuntu-latest
    needs: [test, dotnet-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build package
        run: |
          dotnet restore dotnet/src/Iqb.Responses/Iqb.Responses.csproj
          dotnet build dotnet/src/Iqb.Responses/Iqb.Responses.csproj --configuration Release --no-restore

      - name: Create NuGet package
        run: dotnet pack dotnet/src/Iqb.Responses/Iqb.Responses.csproj --configuration Release --no-build --output dotnet/artifacts

      - name: Verify package without a project reference
        run: |
          dotnet restore dotnet/smoke/Iqb.Responses.Smoke/Iqb.Responses.Smoke.csproj --source dotnet/artifacts
          dotnet run --project dotnet/smoke/Iqb.Responses.Smoke/Iqb.Responses.Smoke.csproj --configuration Release --no-restore

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iqb-responses-nuget
          path: |
            dotnet/artifacts/*.nupkg
            dotnet/artifacts/*.snupkg
          retention-days: 30
