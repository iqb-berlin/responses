name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency graph
        run: npm ls --all > /dev/null

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

      - name: Exercise the Babel TypeScript preset
        run: npm run test:toolchain

      - name: Upload coverage reports
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          # Public fork PRs retain tokenless uploads; owned branches authenticate with OIDC.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          flags: unittests
          name: codecov-umbrella
        if: matrix.node-version == '26.x'

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run prepare_publish

      - name: Verify npm package and stable JavaScript compatibility
        run: npm run test:package

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30

  package-runtime:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify the modern build on the previous package runtimes
        run: node scripts/verify-package.js --runtime-only

  dotnet-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK and .NET 10 runtime
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Setup Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: 'npm'

      - name: Install TypeScript reference
        run: |
          npm ci
          npm run prepare_publish

      - name: Restore .NET projects
        run: dotnet restore dotnet/Iqb.Responses.sln

      - name: Build .NET projects
        run: dotnet build dotnet/Iqb.Responses.sln --configuration Release --no-restore

      - name: Run parity tests with coverage
        run: >-
          dotnet test --solution dotnet/Iqb.Responses.sln
          --configuration Release --no-build
          --results-directory "${{ github.workspace }}/dotnet/TestResults"
          --coverlet --coverlet-include '[Iqb.Responses]*' --coverlet-output-format cobertura

      - name: Enforce line and branch coverage on the packaged library
        run: |
          mv dotnet/TestResults/coverage.cobertura.*.xml dotnet/TestResults/coverage.cobertura.xml
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET

          report = ET.parse("dotnet/TestResults/coverage.cobertura.xml").getroot()
          for metric, threshold in [("lines", 90), ("branches", 80)]:
              covered = int(report.attrib[f"{metric}-covered"])
              total = int(report.attrib[f"{metric}-valid"])
              if total <= 0 or covered * 100 < total * threshold:
                  raise SystemExit(f"{metric}: {covered}/{total} below {threshold}%")
              print(f"{metric}: {covered}/{total} ({100 * covered / total:.2f}%)")
          PYTHON

      - name: Check shared-feature parity and runtime-specific boundaries
        run: npm run test:differential

      - name: Upload differential failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-failure
          path: artifacts/differential/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload .NET coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: dotnet/TestResults/coverage.cobertura.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          flags: dotnet
          name: dotnet-coverage

  dotnet-package:
    runs-on: ubuntu-latest
    needs: [test, dotnet-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the .NET SDK and .NET 10 runtime
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Restore and build package
        run: |
          dotnet restore dotnet/src/Iqb.Responses/Iqb.Responses.csproj
          dotnet build dotnet/src/Iqb.Responses/Iqb.Responses.csproj --configuration Release --no-restore

      - name: Create NuGet package
        run: dotnet pack dotnet/src/Iqb.Responses/Iqb.Responses.csproj --configuration Release --no-build --output dotnet/artifacts

      - name: Verify package without a project reference
        run: |
          dotnet restore dotnet/smoke/Iqb.Responses.Smoke/Iqb.Responses.Smoke.csproj --source dotnet/artifacts
          dotnet run --project dotnet/smoke/Iqb.Responses.Smoke/Iqb.Responses.Smoke.csproj --configuration Release --no-restore

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iqb-responses-nuget
          path: |
            dotnet/artifacts/*.nupkg
            dotnet/artifacts/*.snupkg
          retention-days: 30
